<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Zjazd w kopalni · Sowie Fiszki</title>
<link rel="icon" href="/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script src="data.js"></script>
<script src="game-stats.js"></script>
<style>
:root{
  --amber:#ffb347; --gold:#ffd36b; --hot:#ff5d4a; --ok:#8affc0;
  --glass:rgba(24,16,10,.74); --line:rgba(255,214,150,.22); --wood:#6b4424;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0a0705;color:#fff7ea;font-family:'Nunito',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-tap-highlight-color:transparent}

/* Powrót */
.back-link{position:fixed;z-index:200;top:14px;left:14px;display:inline-flex;align-items:center;gap:6px;
  background:var(--glass);border:1px solid var(--line);color:#fff;text-decoration:none;font-weight:800;
  padding:9px 15px;border-radius:999px;font-size:14px;backdrop-filter:blur(10px);box-shadow:0 6px 20px #0006}
.back-link:hover{background:rgba(255,220,170,.14)}
body.racing .back-link{opacity:0;pointer-events:none}

/* ── SCENA 3D ── */
#game{position:absolute;inset:0;overflow:hidden;background:#0a0705}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.vignette{position:absolute;inset:0;z-index:28;pointer-events:none;box-shadow:inset 0 0 180px #000c}
body.boost .vignette{box-shadow:inset 0 0 240px #000e}
/* Zrzut węgla: ognista poświata krawędzi (na telefonie zamiast rozmycia w shaderze) */
.boostfx{position:absolute;inset:0;z-index:27;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 78% 72% at 50% 50%,transparent 50%,rgba(255,150,40,.16) 76%,rgba(255,70,20,.44) 100%)}
.hitfx{position:absolute;inset:0;z-index:27;pointer-events:none;opacity:0}
.hitfx.ok{background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(80,255,150,0) 30%,rgba(80,255,150,.35) 100%);animation:hitFx .8s ease-out}
.hitfx.bad{background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(255,40,50,.15) 20%,rgba(255,40,50,.55) 100%);animation:hitFx 1.1s ease-out}
@keyframes hitFx{0%{opacity:0}15%{opacity:1}100%{opacity:0}}

/* HUD — jak na obrazku: punkty i czas z lewej, pytanie na środku, życia z prawej */
.hud{position:absolute;z-index:30;top:14px;left:14px;right:14px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  align-items:start;gap:10px;pointer-events:none}
.hgrp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hgrp.l{justify-self:start}
.hgrp.r{justify-self:end;justify-content:flex-end}
/* panele = żelazne tabliczki z nitami w rogach */
.panel{position:relative;background:linear-gradient(180deg,rgba(62,47,35,.9),rgba(26,19,13,.92));border:2px solid rgba(170,128,84,.55);
  padding:7px 15px;border-radius:12px;font-weight:900;box-shadow:0 8px 22px #0008,inset 0 1px 0 rgba(255,220,170,.2);
  display:flex;align-items:center;gap:8px;font-size:15px;transition:box-shadow .2s,border-color .2s}
.panel::before{content:'';position:absolute;inset:3px;pointer-events:none;border-radius:9px;
  background:radial-gradient(circle,#d9b88c 0 1.4px,transparent 2px) left top/7px 7px no-repeat,radial-gradient(circle,#d9b88c 0 1.4px,transparent 2px) right top/7px 7px no-repeat,
    radial-gradient(circle,#d9b88c 0 1.4px,transparent 2px) left bottom/7px 7px no-repeat,radial-gradient(circle,#d9b88c 0 1.4px,transparent 2px) right bottom/7px 7px no-repeat}
.panel .lab{opacity:.75;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#ffdcae}
.panel .val{font-family:'Alfa Slab One',Georgia,serif;font-size:19px;color:var(--gold);font-weight:400}
.panel .ico{display:none}
#combo .val{color:var(--amber)} #time .val{color:#ffe9c9;min-width:3.2ch} #speedo .val{color:#b9ffcf;min-width:3ch;text-align:right}
#speedo.hot{border-color:rgba(255,160,70,.9);box-shadow:0 0 26px rgba(255,120,40,.65)}
#speedo.hot .val{color:#ffe0a8;text-shadow:0 0 12px #ff8a2a}
#speech{pointer-events:auto;cursor:pointer;transition:transform .1s}
#speech:active{transform:scale(.94)}
#speech.off{opacity:.5}
.hrt{display:inline-block;font-size:22px;line-height:1;font-style:normal;filter:drop-shadow(0 0 6px rgba(255,60,90,.55));transition:filter .35s,opacity .35s}
.hrt.lost{filter:grayscale(1) brightness(.8);opacity:.4}
.hrt.pop{animation:heartLost .75s cubic-bezier(.2,.8,.2,1)}
@keyframes heartLost{0%{transform:scale(1)}22%{transform:scale(1.75) rotate(-14deg);filter:drop-shadow(0 0 12px #ff2d55);opacity:1}55%{transform:scale(.75) rotate(9deg)}100%{transform:scale(1)}}
#lives{gap:3px;padding:6px 12px}
#lives.hit{border-color:rgba(255,80,110,.95);box-shadow:0 0 28px rgba(255,45,85,.7)}

/* Tablica z pytaniem (drewniana deska) */
#task{grid-column:2;text-align:center;min-width:min(480px,44vw);max-width:min(640px,60vw)}
#task .plate{position:relative;background:repeating-linear-gradient(180deg,rgba(0,0,0,.1) 0 2px,transparent 2px 9px),linear-gradient(180deg,#7c5232,#5d3b21 60%,#4b2f19);
  border:3px solid #2a1a0d;border-radius:12px;padding:8px 26px 11px;box-shadow:0 12px 30px #0009,inset 0 0 0 2px rgba(255,210,150,.16)}
#task .plate::before,#task .plate::after{content:'';position:absolute;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#eed8b6,#6d5640)}
#task .plate::before{left:8px}#task .plate::after{right:8px}
#task small{color:#ffe2b0;opacity:.85;letter-spacing:2px;font-weight:800;font-size:11px}
#word{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:30px;line-height:1.15;margin-top:3px;color:#fff3dc;text-transform:uppercase;
  text-shadow:0 2px 0 #2a160a,0 0 18px rgba(255,170,60,.35);word-break:break-word}
#word.nb{text-transform:none}
#word.l{font-size:24px} #word.xl{font-size:19px}

/* Napisy na tablicach nad tunelami — elementy HTML rzutowane co klatkę (jedna fala = jeden rząd w kolejności torów) */
.lbl{position:absolute;left:0;top:0;z-index:29;pointer-events:none;white-space:nowrap;text-align:center;
  font-family:'Alfa Slab One',Georgia,serif;font-size:23px;line-height:1.08;color:#fff4dc;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.11) 0 2px,transparent 2px 8px),linear-gradient(180deg,#8a5a33,#6a4222 58%,#55341b);
  border:3px solid #2b1a0c;border-radius:8px;padding:6px 17px 7px;transform-origin:50% 50%;
  box-shadow:0 6px 16px #000a,inset 0 0 0 2px rgba(255,214,160,.16);text-shadow:0 2px 0 #2a1408,0 0 6px #000;opacity:0;will-change:transform,opacity}
.lbl::before,.lbl::after{content:'';position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e8d2b0,#6d5640)}
.lbl::before{left:5px}.lbl::after{right:5px}
.lbl small{display:block;font-family:'Nunito',sans-serif;font-weight:800;font-size:.58em;color:#ffe2b8;opacity:.92;margin-top:1px;text-shadow:0 1px 2px #000}
/* tunel, do którego prowadzi ustawiona zwrotnica (nie zdradza odpowiedzi — to tylko „celownik”) */
.lbl.aim{border-color:#ffe39a;box-shadow:0 6px 16px #000a,0 0 0 3px rgba(255,226,150,.72),0 0 22px rgba(255,190,80,.65),inset 0 0 0 2px rgba(255,214,160,.3)}
.lbl.ok{background:linear-gradient(180deg,#25a85d,#147a40);border-color:#9dffc6}
.lbl.hint{background:linear-gradient(180deg,#1f9450,#116a37);border-color:#9dffc6}
.lbl.bad{background:linear-gradient(180deg,#c2303f,#8f1c2a);border-color:#ff9aa6}
.lbl.gone{filter:grayscale(.85) brightness(.6)}
#leads{position:absolute;inset:0;width:100%;height:100%;z-index:29;pointer-events:none;overflow:visible}
#leads line{stroke:#ffd9a0;stroke-width:2.5;stroke-linecap:round;opacity:0}

/* Komunikat */
#msg{position:absolute;z-index:40;top:44%;left:50%;transform:translate(-50%,-50%) scale(.8);font-family:'Alfa Slab One',Georgia,serif;
  font-size:clamp(26px,8vw,54px);opacity:0;pointer-events:none;text-shadow:0 4px 20px #000;white-space:nowrap}
#msg.ok{color:#8affc0;text-shadow:0 0 24px #22e88a,0 3px 0 #0b3a1e} #msg.bad{color:#ff8a8a;text-shadow:0 0 24px #ff2d2d,0 3px 0 #3a0b0b}
.flash{animation:flash .8s cubic-bezier(.2,.8,.2,1)}
@keyframes flash{15%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
/* zwrotnica zablokowana tuż przed tunelem */
#swHint{position:absolute;z-index:41;left:50%;bottom:150px;transform:translate(-50%,8px);opacity:0;pointer-events:none;white-space:nowrap;
  background:rgba(30,18,10,.88);border:1px solid rgba(255,190,110,.5);border-radius:999px;padding:7px 15px;font-weight:900;font-size:14px;transition:opacity .25s,transform .25s}
#swHint.show{opacity:1;transform:translate(-50%,0)}

/* Toast (odblokowanie wózka) — pod HUD-em */
#toast{position:absolute;z-index:45;left:50%;top:calc(var(--hudB,130px) + 10px);transform:translate(-50%,-12px);opacity:0;pointer-events:none;
  background:linear-gradient(135deg,#a8561f,#e0902f);border:1px solid #ffd59a;border-radius:16px;padding:11px 18px;font-weight:900;font-size:16px;
  box-shadow:0 14px 34px #000a,0 0 30px rgba(255,160,60,.45);transition:opacity .3s,transform .3s;text-align:center;max-width:92vw}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* 🪨 Zrzut węgla do pieca — manometr w płomieniach + przycisk (prawy dolny róg) */
#nitroBox{position:absolute;z-index:62;right:18px;bottom:16px;display:none;flex-direction:column;align-items:center;gap:4px;width:150px}
body.racing #nitroBox{display:flex}
#nitroBox .fl{position:absolute;left:50%;top:-14px;width:120px;height:110px;transform:translateX(-50%);pointer-events:none;opacity:.25;transition:opacity .25s}
#nitroBox .fl i{position:absolute;bottom:0;width:46px;height:84px;border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 85%,#fff3b0 0,#ffc23d 22%,#ff7a1a 48%,rgba(220,40,10,.5) 70%,transparent 75%);filter:blur(1.5px);animation:flick 1.1s ease-in-out infinite;transform-origin:50% 100%}
#nitroBox .fl i:nth-child(1){left:6px;animation-delay:-.3s;height:70px}
#nitroBox .fl i:nth-child(2){left:37px;height:96px;animation-delay:-.7s}
#nitroBox .fl i:nth-child(3){left:68px;animation-delay:-.1s;height:76px}
@keyframes flick{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.12) skewX(4deg)}60%{transform:scale(1.06,.9) skewX(-5deg)}}
#nitroBox.ready .fl{opacity:.85}
#nitroBox.on .fl{opacity:1}
#nitroBox.on .fl i{animation-duration:.35s;height:118px}
#nitroBox.wait .fl{opacity:.12}
#mano{position:relative;width:96px;height:96px;filter:drop-shadow(0 6px 14px #000a)}
#mano text{font-family:'Alfa Slab One',Georgia,serif;fill:#3a2412}
#nitroBtn{position:relative;border:2px solid #ffd08a;border-radius:14px;padding:7px 10px 6px;width:150px;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(180deg,#e2791e,#a53f10);color:#fff;font-family:'Alfa Slab One',Georgia,serif;font-size:15px;line-height:1.05;
  display:flex;flex-direction:column;align-items:center;box-shadow:0 10px 24px #0009,0 0 18px rgba(255,140,40,.45);transition:transform .12s,filter .2s,opacity .2s;-webkit-user-select:none}
#nitroBtn .nk{font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;opacity:.8;margin-top:2px}
#nitroBox.wait #nitroBtn{filter:grayscale(.85) brightness(.7);opacity:.7}
#nitroBox.ready #nitroBtn{animation:nitroPulse 1.1s ease-in-out infinite}
#nitroBox.on #nitroBtn{transform:scale(1.07);box-shadow:0 0 34px rgba(255,170,60,.95),0 0 70px rgba(255,80,20,.6)}
#nitroBtn:focus-visible{outline:3px solid #fff;outline-offset:3px}
@keyframes nitroPulse{50%{box-shadow:0 10px 24px #0009,0 0 36px rgba(255,160,50,.95)}}
#cartChip{position:absolute;z-index:61;left:16px;bottom:16px;display:none;align-items:center;gap:6px;font:inherit;font-weight:900;font-size:14px;color:#fff;
  background:linear-gradient(90deg,rgba(255,179,71,.32) var(--p,0%),transparent var(--p,0%)),var(--glass);border:1px solid var(--line);
  border-radius:999px;padding:9px 15px;backdrop-filter:blur(10px);box-shadow:0 8px 22px #0007;white-space:nowrap;touch-action:manipulation}
body.racing #cartChip{display:flex}
#cartChip:disabled{cursor:default;color:#fff;opacity:1}
#cartChip.unlocked{background:linear-gradient(135deg,#c26a22,#8a3c12);border-color:#ffd59a;cursor:pointer;box-shadow:0 8px 22px #0007,0 0 18px rgba(255,160,60,.45)}
#cartChip.unlocked:active{transform:scale(.96)}
.cartprog{margin:14px auto 0;max-width:340px;font-weight:900;font-size:15px}
.cartprog .cpbar{height:8px;border-radius:9px;background:#1a120c;border:1px solid var(--line);overflow:hidden;margin-bottom:6px}
.cartprog .cpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--amber),var(--gold))}

/* Wybór wózka (gra wstrzymana; wózek widać pod oknem) */
#picker{position:absolute;inset:0;z-index:120;display:none;align-items:flex-start;justify-content:center;padding:66px 14px 14px;
  background:linear-gradient(180deg,rgba(8,5,3,.78),rgba(8,5,3,.2) 62%,transparent)}
#picker.open{display:flex}
body.picking #nitroBox,body.picking #cartChip,body.picking #touch{visibility:hidden}
#picker .pbox{width:min(700px,100%);max-height:min(54vh,520px);display:flex;flex-direction:column;background:linear-gradient(180deg,#2a1d14f4,#170f0af4);
  border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px #000b;overflow:hidden}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px 6px 18px;font-size:18px;font-weight:900}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:6px 14px;overflow:auto;-webkit-overflow-scrolling:touch}
.copt{display:flex;align-items:center;gap:9px;text-align:left;padding:9px 11px;border-radius:12px;border:2px solid var(--line);background:#1a120c;
  color:#fff;font:inherit;font-weight:800;font-size:14px;cursor:pointer;line-height:1.2}
.copt:hover{border-color:rgba(255,179,71,.55)}
.copt[aria-pressed="true"]{border-color:var(--amber);background:#2c1d11;box-shadow:0 0 0 2px rgba(255,179,71,.22) inset}
.copt .ce{font-size:22px;flex:none}
.copt .sw{width:13px;height:13px;border-radius:50%;flex:none;border:1px solid #fff8;margin-left:auto}
.pfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px 14px;flex-wrap:wrap}
.pnote{opacity:.7;font-size:13px;font-weight:800}
.pclose{background:none;border:0;color:#fff;font-size:22px;cursor:pointer;padding:2px 8px;border-radius:8px}
.pclose:hover{background:rgba(255,255,255,.1)}

/* Okno START / Game Over / quiz */
#overlay{position:absolute;z-index:100;inset:0;background:rgba(8,5,3,.55);display:grid;place-items:center;padding:18px;backdrop-filter:blur(3px);overflow:auto}
.card{position:relative;max-width:660px;width:94%;background:linear-gradient(180deg,#2b1e14f0,#160f0af0);border:1px solid var(--line);
  padding:26px 26px 22px;text-align:center;border-radius:22px;box-shadow:0 30px 80px #000c,inset 0 1px 0 #ffffff14}
.card h1{font-family:'Alfa Slab One',Georgia,serif;font-weight:400;font-size:34px;margin:0 0 6px;letter-spacing:.5px;
  background:linear-gradient(90deg,var(--gold),var(--amber) 55%,#ff8a3a);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card p{line-height:1.55;font-size:16px;opacity:.92}
.card .sub{margin:0 0 6px;font-weight:800}
.link-row{margin-top:16px}.link-row a{color:var(--gold);font-weight:800;text-decoration:none}
.big{font-size:32px;font-family:'Alfa Slab One',Georgia,serif;color:var(--gold)}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{border:0;background:linear-gradient(135deg,#ffc25a,#f0892a);color:#2a1505;font-weight:900;font-size:20px;
  padding:14px 30px;border-radius:14px;cursor:pointer;margin-top:18px;font-family:'Nunito',sans-serif;
  box-shadow:0 10px 26px rgba(255,150,50,.32);transition:transform .12s,box-shadow .12s;letter-spacing:.3px}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(255,150,50,.5)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55;cursor:wait;transform:none}
.btn.alt{background:linear-gradient(135deg,#a8561f,#7a3510);color:#fff;box-shadow:0 10px 26px rgba(160,80,30,.4)}
.btn.sm{font-size:16px;padding:11px 20px;margin-top:0}
.btn.locked:disabled{cursor:not-allowed;filter:grayscale(.7)}
.gate{margin:14px auto 0;max-width:460px;background:#1a120c;border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:800;font-size:15px;line-height:1.5}
.hint{opacity:.6;font-size:12px;margin-top:16px;line-height:1.6}
.hint kbd,.howto kbd{background:#1a120c;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-family:inherit;font-weight:800}
/* wybór rodzaju pytań */
.mlab{font-weight:900;font-size:14px;letter-spacing:.4px;margin:12px 0 7px;opacity:.9}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mode{display:flex;flex-direction:column;align-items:center;gap:1px;padding:10px 6px 9px;border-radius:14px;border:2px solid var(--line);background:#1b130d;color:#fff;
  font:inherit;font-weight:900;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.mode:hover{border-color:rgba(255,179,71,.55)}
.mode:active{transform:scale(.97)}
.mode .mi{font-size:26px;line-height:1.15}
.mode small{font-weight:800;opacity:.65;font-size:11px}
.mode[aria-pressed="true"]{border-color:var(--amber);background:#2e1f12;box-shadow:0 0 0 2px rgba(255,179,71,.22) inset,0 0 18px rgba(255,170,60,.22)}
.mode:focus-visible{outline:3px solid #fff;outline-offset:2px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin-top:10px}
.opts.one{grid-template-columns:1fr}
.opts[hidden]{display:none}
.opts label{display:block;font-weight:800;margin:0 0 5px;font-size:13px;opacity:.85}
.opts select{width:100%;padding:12px 14px;border-radius:13px;border:1px solid var(--line);background:#1a120c;color:#fff;font:inherit;font-weight:800;font-size:16px;outline:none}
.opts select:focus{border-color:var(--amber)}
.minfo{margin:10px 0 0;font-size:14px!important;font-weight:800;opacity:.8!important}
.minfo:empty{display:none}
.cerr{min-height:0;color:#ffb3a8;font-weight:900;margin-top:8px}
.cerr:empty{display:none}
.howto{list-style:none;padding:0;margin:16px 0 0;text-align:left;display:grid;gap:7px;font-size:14px;line-height:1.5;font-weight:700}
.howto li{background:rgba(255,220,170,.05);border:1px solid rgba(255,214,150,.12);border-radius:12px;padding:8px 12px}

/* Przepisywanie po złym tunelu (gra wstrzymana; okno u góry — na telefonie nad klawiaturą) */
#retype{position:absolute;inset:0;z-index:110;display:none;align-items:flex-start;justify-content:center;padding:70px 14px 14px;
  background:rgba(8,5,3,.6);backdrop-filter:blur(2px);overflow:auto}
#retype.open{display:flex}
body.retyping #nitroBox,body.retyping #cartChip,body.retyping #touch{visibility:hidden}
.rtbox{width:min(520px,100%);margin:0;background:linear-gradient(180deg,#2b1e14f6,#160f0af6);border:1px solid var(--line);border-radius:20px;
  padding:16px 18px 16px;text-align:center;box-shadow:0 24px 60px #000b,inset 0 1px 0 #ffffff14}
.rthead{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px;font-weight:900;text-align:left}
#rtLives{flex:none;white-space:nowrap}
.rthead .hrt{font-size:19px}
.rtq{margin:12px 0 4px;font-weight:800;opacity:.85;font-size:15px}
.rtq b{font-size:20px;opacity:1;color:#fff}
.rtans{display:flex;align-items:center;justify-content:center;gap:10px;margin:6px 0 12px;padding:10px 12px;border-radius:14px;
  background:rgba(18,150,80,.22);border:2px solid #8affc0;font-size:28px;font-weight:900;color:#c9ffe1;word-break:break-word}

<script>
/* ══════════════════════════════════════════════════════════
   ZJAZD W KOPALNI 3D — jazda wózkiem kopalnianym po podziemnych torach.
   Na podstawie Kosmicznego wyścigu (space-racer.html): ta sama logika gry (fale odpowiedzi,
   wykrywanie przejazdu odcinkiem, 3 życia + przepisywanie, Game Over → quiz A/B/C min. 4/5,
   lektor, ?book=&unit=, globalna `score` dla game-stats.js, zmiana pojazdu po 200 pkt).
   three.js r160 (import map) → globalny THREE; na komputerze poświata (UnrealBloom).
   • 3 równoległe tory (bez swobodnego sterowania): ←/→ przestawia zwrotnicę — przed wózkiem
     pojawia się rozjazd (łuk S na sąsiedni tor, dźwignia przy torze, iskry, szczęk).
     Zwrotnicy nie da się przestawić, gdy rozjazd nie zmieściłby się przed wejściem do tunelu
     (blokada 🔒 — wybór rozstrzyga się wcześniej); naciśnięcie w tunelu czeka do jego wyjścia.
   • Fala = 3 tunele w skalnej ścianie (po jednym na każdym torze) z tablicą i bursztynowymi
     lampkami. Liczy się tor w chwili przejazdu przez wejście (resolveWave, raz na falę).
   • Linia naprowadzająca = świecące szyny toru, na który prowadzi zwrotnica (+ „celownik” na tablicy).
   • 🪨 Zrzut węgla do pieca (spacja): raz na falę, szufla węgla → płomienie z komina, wózek pędzi.
   • Rodzaje pytań: 📚 słówka z podręcznika · ✖️ matematyka · 📜 daty historyczne · 💎 minerały i skały.
   • Chodnik przewijany okresowo (P = 192 m, grupa `tun` przesuwana o dist mod P): ściany, stemple,
     lampy, kable, rury, żyły i kryształy, komora z wagonikami. Światło lamp liczone w shaderze
     (minePatch: 4 najbliższe lampy + 3 lampki tuneli), bez setek PointLight.
   Zapis postępu: localStorage + konto (grammar_city_saves, slot 'mine').
   ══════════════════════════════════════════════════════════ */
const $=s=>document.querySelector(s);
const game=$("#game"),word=$("#word"),qHead=$("#qHead"),scoreEl=$("#score .val"),comboEl=$("#combo .val"),timeEl=$("#time .val"),speedEl=$("#speedo .val"),speedoEl=$("#speedo"),msg=$("#msg"),
  overlay=$("#overlay"),nitroBtn=$("#nitroBtn"),nitroBox=$("#nitroBox"),cartChip=$("#cartChip"),picker=$("#picker"),toastEl=$("#toast"),boostEl=$(".boostfx"),hitEl=$("#hitfx"),
  livesEl=$("#lives"),retypeEl=$("#retype"),rtIn=$("#rtIn"),rtFb=$("#rtFb"),swHint=$("#swHint"),manoNeedle=$("#manoNeedle");
let WORDS=[], score=0, combo=0, cur=null, run=false, paused=false, speech=true, keys={}, audio, voices=[], lastK='';
let TARGET_LANG='en-GB', LANG_NAME='po angielsku';
const LANG_TTS={en:'en-GB',fr:'fr-FR',de:'de-DE',ru:'ru-RU',es:'es-ES',it:'it-IT'};
const LANG_PL={en:'po angielsku',fr:'po francusku',de:'po niemiecku',ru:'po rosyjsku',es:'po hiszpańsku',it:'po włosku'};
// Rodzaj pytań: words | math | dates | minerals; poziom matematyki: mul | addsub | div | mix
let MODE='words', MATH_LV='mul', BOOK_ID='', UNIT_KEY='all';
// Życia i przerwy: held = świat zatrzymany (okno przepisywania albo odliczanie cdT)
const LIVES=3;
let lives=LIVES, errItems=[], held=false, cdT=0, cdN=0, crashTimer=0, raceT=0, timeLast=-1;
const hudEl=document.querySelector('.hud');
let hudBottom=0;
function hudShift(){hudBottom=Math.round(hudEl.offsetTop+hudEl.offsetHeight);game.style.setProperty('--hudB',hudBottom+'px')}
if('ResizeObserver'in window)new ResizeObserver(hudShift).observe(hudEl);
const COARSE=matchMedia('(pointer:coarse)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTime=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const fract=x=>x-Math.floor(x);
const TAU=Math.PI*2;
const cap1=s=>String(s).replace(/^([^\p{L}]*)(\p{L})/u,(m,a,b)=>a+b.toUpperCase());

/* ── audio / TTS ── */
function tone(f,d,type="square",v=.05){if(!audio)return;try{let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function unlockAudio(){try{audio||=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){}}
let _nb=null;
function noiseBuf(){if(!audio)return null;if(_nb)return _nb;const len=Math.floor(audio.sampleRate*2),b=audio.createBuffer(1,len,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;return _nb=b}
// krótki szum przez filtr (szczęk metalu, stukot kół, szufla)
function noiseHit(t0,dur,freq,q,gain,type='bandpass'){
  const n=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();n.buffer=noiseBuf();f.type=type;f.frequency.value=freq;f.Q.value=q;
  g.gain.setValueAtTime(gain,t0);g.gain.exponentialRampToValueAtTime(.0008,t0+dur);n.connect(f).connect(g).connect(audio.destination);n.start(t0,Math.random()*1.5,dur+.05);
}
function clankSound(){if(!audio)return;try{const t=audio.currentTime;noiseHit(t,.08,2400,1.3,.17);noiseHit(t+.05,.15,850,1,.11);tone(1480,.24,'triangle',.03);setTimeout(()=>tone(990,.2,'triangle',.028),45)}catch(e){}}
function lockSound(){if(!audio)return;try{const t=audio.currentTime;noiseHit(t,.07,380,1,.13,'lowpass');tone(130,.13,'square',.045)}catch(e){}}
function clackSound(k){if(!audio||k<=.02)return;try{noiseHit(audio.currentTime,.035,2700,2.2,.045*k)}catch(e){}}
function crashSound(){tone(85,.55,"sawtooth",.12);setTimeout(()=>tone(46,.6,"square",.08),80);if(audio)try{noiseHit(audio.currentTime,.5,600,.6,.2,'lowpass')}catch(e){}}
function winSound(){tone(660,.12,'triangle',.06);setTimeout(()=>tone(880,.12,'triangle',.06),110);setTimeout(()=>tone(1320,.22,'triangle',.05),220);setTimeout(()=>tone(1760,.18,'sine',.03),330)}
function missSound(){tone(330,.16,"triangle",.06);setTimeout(()=>tone(250,.2,"triangle",.05),110)}
// Zrzut węgla: szuflowanie (szum) + huk ognia w piecu (narastający szum i niski pomruk)
function stokeSound(){
  if(!audio)return;
  try{
    const t=audio.currentTime;noiseHit(t,.18,1300,.7,.15);noiseHit(t+.16,.14,900,.8,.1);
    const o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70,t+.25);o.frequency.exponentialRampToValueAtTime(190,t+1.1);
    g.gain.setValueAtTime(.0001,t+.25);g.gain.exponentialRampToValueAtTime(.05,t+.35);g.gain.exponentialRampToValueAtTime(.001,t+1.4);o.connect(g).connect(audio.destination);o.start(t+.25);o.stop(t+1.45);
    const n=audio.createBufferSource(),bp=audio.createBiquadFilter(),ng=audio.createGain();n.buffer=noiseBuf();
    bp.type='lowpass';bp.frequency.setValueAtTime(300,t+.25);bp.frequency.exponentialRampToValueAtTime(3200,t+.9);
    ng.gain.setValueAtTime(.0001,t+.25);ng.gain.exponentialRampToValueAtTime(.16,t+.4);ng.gain.exponentialRampToValueAtTime(.001,t+1.5);
    n.connect(bp).connect(ng).connect(audio.destination);n.start(t+.25,0,1.3);
  }catch(e){}
}
// cichy szum toczenia kół (głośniejszy przy prędkości)
let rumble=null;
function rumbleOn(){if(!audio||rumble)return;try{const n=audio.createBufferSource();n.buffer=noiseBuf();n.loop=true;const f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=150;const g=audio.createGain();g.gain.value=0;n.connect(f).connect(g).connect(audio.destination);n.start();rumble={n,f,g}}catch(e){}}
function rumbleSet(k,fk){if(rumble)try{rumble.g.gain.setTargetAtTime(k,audio.currentTime,.12);rumble.f.frequency.setTargetAtTime(fk,audio.currentTime,.2)}catch(e){}}
function loadV(){voices=speechSynthesis?.getVoices?.()||[]} if("speechSynthesis"in window){loadV();speechSynthesis.onvoiceschanged=loadV}
function best(lang){loadV();let a=voices.filter(v=>v.lang.toLowerCase().startsWith(lang.toLowerCase()));return a.find(v=>/google/i.test(v.name))||a.find(v=>/natural|online/i.test(v.name))||a[0]}
// Kilka wypowiedzi po kolei: [[tekst, język], …] (np. minerał po polsku, potem po angielsku)
function speakSeq(list,force,queue){
  if((!speech&&!force)||!("speechSynthesis"in window)||!list||!list.length)return;

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

// Powtarzalny generator losowy (tekstury i rozmieszczenie wyglądają tak samo przy każdym wejściu)
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(i,j,seed){let h=(Math.imul(i|0,374761393)+Math.imul(j|0,668265263)+Math.imul(seed|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
// szum wartości; okresowy w x z okresem per komórek (chodnik powtarza się co P metrów)
function vnoise(x,y,cell,per,seed){x/=cell;y/=cell;const x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0,sx=fx*fx*(3-2*fx),sy=fy*fy*(3-2*fy);
  const i0=((x0%per)+per)%per,i1=(i0+1)%per,a=hash2(i0,y0,seed),b=hash2(i1,y0,seed),c=hash2(i0,y0+1,seed),d=hash2(i1,y0+1,seed);
  return a+(b-a)*sx+(c-a)*sy+(a-b-c+d)*sx*sy}

function wordItem(w){return {k:'w:'+normAns(w[1]),head:'WJEDŹ DO TUNELU Z TŁUMACZENIEM',q:w[0],big:true,say:[[w[0],'pl-PL']],a:w[1],sub:'',pl:w[0],

const fac=()=>Math.random()<.08?1:ri(2,10);
function mathItem(lv){
  let op=lv;if(lv==='mix')op=pick(['mul','mul','add','sub','div']);else if(lv==='addsub')op=pick(['add','sub']);
  let a,b,n,q,say;
  if(op==='mul'){a=fac();b=fac();n=a*b;q=`${a} × ${b} =`;say=`${a} razy ${b}`}
  else if(op==='div'){b=ri(2,10);n=ri(1,10);a=b*n;q=`${a} : ${b} =`;say=`${a} podzielić przez ${b}`}
  else if(op==='add'){a=ri(3,95);b=ri(2,100-a);n=a+b;q=`${a} + ${b} =`;say=`${a} dodać ${b}`}
  else{a=ri(11,100);b=ri(2,a-1);n=a-b;q=`${a} − ${b} =`;say=`${a} odjąć ${b}`}
  return {k:'m:'+q,op,x:a,y:b,n,head:'✖️ WJEDŹ DO TUNELU Z WYNIKIEM',q:'Oblicz: '+q,qShort:q,say:[[say,'pl-PL']],a:String(n),sub:'',
    aLang:'pl-PL',aSay:[[String(n),'pl-PL']],rtLab:'Działanie:',qq:'Oblicz:',num:true};
}
function swapDigits(n){if(n<10||n>99)return 0;const t=Math.floor(n/10),u=n%10;return t===u||u===0?0:u*10+t}
// Błędne wyniki blisko poprawnego: ±1, ±jeden czynnik, przestawione cyfry, ±10 — różne, dodatnie, całkowite
function mathWrong(it){
  const n=it.n,t1=[],t2=[],sw=swapDigits(n);
  if(it.op==='mul'){t1.push((it.x+1)*it.y,(it.x-1)*it.y,it.x*(it.y+1),it.x*(it.y-1),n+1,n-1);if(sw)t1.push(sw);t2.push(n+2,n-2,n+10,n-10)}
  else if(it.op==='div'){t1.push(n+1,n-1);t2.push(n+2,n-2,n+3)}
  else{t1.push(n+1,n-1,n+10,n-10);if(sw)t1.push(sw);t2.push(n+2,n-2,n+11,n-9)}
  const lim=it.op==='add'||it.op==='sub'?100:1e6;
  const ok=x=>Number.isInteger(x)&&x>0&&x!==n&&x<=lim;
  const out=[];
  for(const x of [...shuffle(t1.filter(ok)),...shuffle(t2.filter(ok))])if(!out.includes(x)){out.push(x);if(out.length===2)break}
  for(let k=3;out.length<2&&k<50;k++){for(const x of [n+k,n-k])if(out.length<2&&ok(x)&&!out.includes(x))out.push(x)}
  return out.map(x=>({a:String(x),sub:''}));
}
function dateItem(i){const d=DATES[i];return {k:'d:'+d[0],idx:i,head:'📜 W KTÓRYM ROKU?',q:cap1(d[1]),say:[['W którym roku: '+(d[2]||d[1])+'?','pl-PL']],a:String(d[0]),sub:'',

// Błędne lata z tej samej listy — najbliższe w czasie (sąsiedzi na osi czasu)
function dateWrong(it){
  let span=2,c=[];
  while(c.length<2&&span<40){c=[];for(let j=it.idx-span;j<=it.idx+span;j++)if(j!==it.idx&&j>=0&&j<DATES.length)c.push(j);span++}
  return shuffle(c).slice(0,2).map(j=>({a:String(DATES[j][0]),sub:''}));
}
function minItem(i){const m=MINERALS[i],q=cap1(m[0])+(/^co /i.test(m[0])?'?':'');return {k:'g:'+m[1],idx:i,head:'💎 CO TO JEST?',q,say:[[q,'pl-PL']],a:m[1],sub:m[2],
  aLang:'pl-PL',aSay:[[m[1],'pl-PL'],[m[2],'en-GB']],rtLab:'Pytanie:',qq:'Co to jest?'}}
function minWrong(it){
  const pool=MINERALS.filter(m=>m[1]!==it.a&&!NO_PAIR.some(p=>p.includes(m[1])&&p.includes(it.a)));
  return shuffle(pool).slice(0,2).map(m=>({a:m[1],sub:m[2]}));
}
function wordWrong(it){
  const k=normAns(it.a),pl=normAns(it.pl);
  let ds=shuffle(WORDS.filter(x=>normAns(x[1])!==k&&normAns(x[0])!==pl));          // bez drugiego tłumaczenia tego samego słowa
  if(ds.length<2)ds=shuffle(WORDS.filter(x=>normAns(x[1])!==k));

}
function wrongOf(it){return MODE==='math'?mathWrong(it):MODE==='dates'?dateWrong(it):MODE==='minerals'?minWrong(it):wordWrong(it)}
// „Worek” (shuffle-bag): wszystkie daty / minerały / słówka pojawiają się, zanim zaczną się powtarzać
let bag=[],bagLast=-1;
function fromBag(n){if(!bag.length){bag=shuffle([...Array(n).keys()]);if(bag.length>1&&bag[bag.length-1]===bagLast)bag.unshift(bag.pop())}const i=bag.pop();bagLast=i;return i}
function genItem(fresh){
  if(MODE==='math')return mathItem(MATH_LV);
  if(MODE==='dates')return dateItem(fresh?fromBag(DATES.length):Math.floor(Math.random()*DATES.length));
  if(MODE==='minerals')return minItem(fresh?fromBag(MINERALS.length):Math.floor(Math.random()*MINERALS.length));
  return wordItem(fresh?WORDS[fromBag(WORDS.length)]:pick(WORDS));
}
function nextItem(){let it;for(let i=0;i<12;i++){it=genItem(true);if(it.k!==lastK)break}lastK=it.k;return it}

function normProg(p){
  p=p&&typeof p==='object'?p:{};
  const total=Math.max(0,Math.min(1e7,Math.floor(+p.total||0)));
  return {total,unlocked:!!p.unlocked||total>=UNLOCK_PTS,cart:CART_DEF[p.cart]?p.cart:DEFAULT_CART,ts:Math.max(0,+p.ts||0)};
}
function mergeProg(a,b){
  a=normProg(a);b=normProg(b);
  const total=Math.max(a.total,b.total);
  return {total,unlocked:a.unlocked||b.unlocked||total>=UNLOCK_PTS,cart:(b.ts>a.ts?b:a).cart,ts:Math.max(a.ts,b.ts)};
}
const sameProg=(x,y)=>!!x&&!!y&&x.total===y.total&&x.unlocked===y.unlocked&&x.cart===y.cart;

const SRV={ok:false,uid:null,timer:null,dirty:false,busy:false};
function sbCfg(){
  try{if(typeof SUPABASE_URL!=='undefined'&&typeof SUPABASE_ANON_KEY!=='undefined')return {u:SUPABASE_URL,k:SUPABASE_ANON_KEY}}catch(e){}
  try{const c=JSON.parse(localStorage.getItem('fiszki_sb_cfg')||'null');if(c&&c.u&&c.k)return c}catch(e){}

const ownSession=s=>!!(s&&s.access_token&&s.user&&s.user.id&&String(s.user.email||'').toLowerCase()===(LOGIN+'@sowie-fiszki.app').toLowerCase());
function sbAuthSync(){
  if(GUEST)return null;
  const c=sbCfg();if(!c)return null;
  try{
    let s=JSON.parse(localStorage.getItem('sb-'+new URL(c.u).hostname.split('.')[0]+'-auth-token')||'null');
    if(s&&s.currentSession)s=s.currentSession;
    if(!ownSession(s)||(s.expires_at&&s.expires_at*1000<Date.now()+20000))return null;
    return {c,token:s.access_token,uid:s.user.id};
  }catch(e){return null}
}
async function sbAuth(){
  const a=sbAuthSync();if(a||GUEST)return a;
  const c=sbCfg(),cl=window.supabase;
  if(!c||!cl||!cl.auth||typeof cl.auth.getSession!=='function')return null;
  try{const {data}=await cl.auth.getSession();const s=data&&data.session;return ownSession(s)?{c,token:s.access_token,uid:s.user.id}:null}catch(e){return null}

async function syncProg(){
  const a=await sbAuth();if(!a)return false;
  let rows;
  try{
    const r=await fetch(a.c.u+'/rest/v1/grammar_city_saves?select=data&slot=eq.'+SAVE_SLOT+'&user_id=eq.'+a.uid,{headers:{apikey:a.c.k,Authorization:'Bearer '+a.token}});
    if(!r.ok)return false;
    rows=await r.json();
  }catch(e){return false}
  SRV.ok=true;SRV.uid=a.uid;
  const srv=Array.isArray(rows)&&rows[0]&&rows[0].data?normProg(rows[0].data):null;
  const m=srv?mergeProg(prog,srv):prog;
  if(!sameProg(m,prog)||m.ts!==prog.ts){prog=m;writeProg();refreshCartUi();applySavedCart()}
  if(!sameProg(m,srv)){SRV.dirty=true;srvFlush(false)}
  return true;
}
function srvQueue(){if(!SRV.ok)return;SRV.dirty=true;clearTimeout(SRV.timer);SRV.timer=setTimeout(()=>srvFlush(false),2500)}
async function srvFlush(keepalive){
  clearTimeout(SRV.timer);SRV.timer=null;
  if(!SRV.ok||!SRV.dirty||SRV.busy)return;
  const a=keepalive?sbAuthSync():await sbAuth();
  if(!a||a.uid!==SRV.uid)return;
  SRV.dirty=false;SRV.busy=true;
  let ok=false;
  try{
    const r=await fetch(a.c.u+'/rest/v1/grammar_city_saves?on_conflict=user_id,slot',{method:'POST',keepalive:!!keepalive,
      headers:{'Content-Type':'application/json',apikey:a.c.k,Authorization:'Bearer '+a.token,Prefer:'resolution=merge-duplicates,return=minimal'},
      body:JSON.stringify([{user_id:a.uid,slot:SAVE_SLOT,data:prog,updated_at:new Date().toISOString()}])});
    ok=r.ok;
  }catch(e){}
  SRV.busy=false;
  if(!ok)SRV.dirty=true;
}
addEventListener('pagehide',()=>srvFlush(true));

function burstSparks(x,y,z,n,spd,up=2.5,back=0,life=.6){for(let i=0;i<n;i++)spark(x,y,z,(Math.random()-.5)*spd,up*(.3+Math.random()),(Math.random()-.5)*spd+back,life*(.5+Math.random()*.8))}
function chimWorld(out){return out.copy(player.chim).applyMatrix4(player.body.matrixWorld)}
function emitSmoke(heavy){const s=smokeData.find(o=>o.life<=0);if(!s)return;chimWorld(s.p);s.v.set((Math.random()-.5)*.6,1.5+Math.random()*.9+(heavy?1.2:0),.4+Math.random()*.8);
  s.max=s.life=(heavy?1.5:2.1)+Math.random()*.6;s.s=(heavy?1.1:.65)+Math.random()*.4}
function updateParticles(dt,dz){
  const sp=sparks.geometry.attributes.position,sl=sparks.geometry.attributes.aL;
  for(let i=0;i<sparkData.length;i++){const s=sparkData[i];
    if(s.life>0){s.life-=dt;s.v.y-=9.8*dt;s.p.addScaledVector(s.v,dt);s.p.z+=dz;if(s.p.y<.05){s.p.y=.05;s.v.y*=-.35;s.v.x*=.6;s.v.z*=.6}
      sp.setXYZ(i,s.p.x,s.p.y,s.p.z);sl.setX(i,Math.max(0,s.life/s.max))}else sl.setX(i,0)}
  sp.needsUpdate=sl.needsUpdate=true;
  const mp=smoke.geometry.attributes.position,ml=smoke.geometry.attributes.aL,ms=smoke.geometry.attributes.aS;
  for(let i=0;i<smokeData.length;i++){const s=smokeData[i];
    if(s.life>0){s.life-=dt;s.p.addScaledVector(s.v,dt);s.p.z+=dz*.4;s.v.y*=Math.exp(-.5*dt);if(s.p.y>5.4){s.p.y=5.4;s.v.y=0}
      mp.setXYZ(i,s.p.x,s.p.y,s.p.z);ml.setX(i,Math.max(0,s.life/s.max));ms.setX(i,s.s)}else ml.setX(i,0)}
  mp.needsUpdate=ml.needsUpdate=ms.needsUpdate=true;
}

/* ── post-processing (tylko komputer): poświata (UnrealBloom) + rozmycie przy zrzucie węgla; przy niskim FPS jakość spada ── */
function initPost(){
  if(COARSE||!THREE.EffectComposer)return;
  try{
    const s=renderer.getDrawingBufferSize(new THREE.Vector2());
    const rt=new THREE.WebGLRenderTarget(s.x,s.y,{type:THREE.HalfFloatType,samples:renderer.capabilities.isWebGL2?4:0});
    const comp=new THREE.EffectComposer(renderer,rt);
    comp.addPass(new THREE.RenderPass(scene,camera));
    const bloom=new THREE.UnrealBloomPass(new THREE.Vector2(s.x,s.y),.55,.42,.95);
    comp.addPass(bloom);
    const blur=new THREE.ShaderPass({uniforms:{tDiffuse:{value:null},uK:{value:0},uAsp:{value:1},uC:{value:new THREE.Vector2(.5,.55)}},
      vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',fragmentShader:POST_FS});
    blur.enabled=false;comp.addPass(blur);
    comp.addPass(new THREE.OutputPass());
    post={comp,bloom,blur};
  }catch(e){console.warn('[Zjazd w kopalni] bez post-processingu:',e);post=null}
}
// Jakość: 2 = poświata + rozmycie; 1 = bez poświaty; 0 = bez post-processingu, piksele 1:1, mniej kurzu
const PERF={acc:0,n:0,warm:0,level:COARSE?1:2,fps:0,bad:0};
function perfTick(raw){
  if(!run||held||paused||document.hidden||raw<=0||raw>.5)return;
  PERF.warm+=raw;if(PERF.warm<3)return;
  PERF.acc+=raw;PERF.n++;
  if(PERF.acc>=2){PERF.fps=PERF.n/PERF.acc;PERF.acc=0;PERF.n=0;
    PERF.bad=PERF.fps<(COARSE?28:45)?PERF.bad+1:0;
    if(PERF.bad>=2&&PERF.level>0){PERF.level--;PERF.bad=0;applyQuality();PERF.warm=1.5}}
}
function applyQuality(){
  if(post)post.bloom.enabled=PERF.level>=2;
  if(PERF.level<=0){post=null;renderer.setPixelRatio(1);dust.geometry.setDrawRange(0,Math.floor(dustData.length*.5));resize()}
  else if(COARSE&&PERF.level<=1){renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));resize()}
}

/* ══════════════ ZWROTNICE ══════════════
   plans = zaplanowane rozjazdy {from,to,S0,S1,L,xo} (S = odległość od startu, jak dist). Kolejne naciśnięcie
   dokłada rozjazd zaraz za poprzednim. Rozjazd zaczyna się kilka metrów przed wózkiem (widać przestawianą dźwignię).
   Blokada przed tunelem: rozjazd musi się skończyć przed wejściem (strefa [Sp−1,75; Sp+TL+1,75]) — jeśli się nie
   zmieści, zwrotnica jest zablokowana 🔒 (wybór toru rozstrzyga się wcześniej, wózek nigdy nie stoi między torami
   przy wejściu). Gdy wózek jest już w tunelu (fala rozstrzygnięta), rozjazd czeka do wyjazdu z tunelu. */
const targetLane=()=>plans.length?plans[plans.length-1].to:lane;
function wallS(w){return dist-w.z}                                           // odległość wejścia tunelu od startu
function requestSwitch(dir){
  if(!run||crashing||held||paused||!R3.ready)return;
  const from=targetLane(),to=from+dir;
  if(to<0||to>=LANES){lockSound();return}
  if(plans.length>=2)return;
  const L=clamp(v*.5,SW_MIN,SW_MAX);
  let S0=Math.max(dist+Math.max(2.5,v*.12),plans.length?plans[plans.length-1].S1:0);
  const ws=waves.map(w=>({w,a:wallS(w)-1.75,b:wallS(w)+TL+1.75})).filter(o=>o.b>dist).sort((x,y)=>x.a-y.a);
  for(const o of ws){
    if(S0<o.b&&S0+L>o.a){
      if(o.w.resolved)S0=o.b;                                                 // w tunelu — przestaw zaraz za wyjazdem
      else{lockSound();swMsg('🔒 Za blisko tunelu — zwrotnica zablokowana');return}
    }
  }
  const xo=xoPool.find(o=>!o.on);if(!xo)return;
  setupXover(xo,from,to,S0,L);
  plans.push({from,to,S0,S1:S0+L,L,xo});
  clankSound();
  const lp=xo.lever.position;burstSparks(lp.x,.35,xo.g.position.z+lp.z,14,2.2,2.2,0,.45);
}
function clearPlans(){plans=[];for(const o of xoPool)freeXover(o)}
// pozycja wózka na torach: px (oś), odchylenie na łuku i przechył (siła odśrodkowa)
let latA=0,inSwitch=false;
function trackPos(){
  while(plans.length&&dist>=plans[0].S1){lane=plans[0].to;plans.shift()}
  const p=plans[0];let x=laneX(lane),dx=0,ddx=0;inSwitch=false;
  if(p&&dist>p.S0){const t=(dist-p.S0)/p.L,a=laneX(p.from),b=laneX(p.to);x=a+(b-a)*t*t*(3-2*t);dx=(b-a)*6*t*(1-t)/p.L;ddx=(b-a)*6*(1-2*t)/(p.L*p.L);inSwitch=true}
  px=x;latA=v*v*ddx;return dx;
}

/* ── rundy i tunele ── */
const curWave=()=>waves.find(w=>w.id===roundId)||null;
function setTask(it){
  qHead.textContent=it.head;

function newRound(){
  nextRoundIn=0;roundId++;
  cur=nextItem();setTask(cur);speakSeq(cur.say,false,true);                  // po kolejce (nie ucina odczytu poprzedniej odpowiedzi)
  spawnWave(roundId);
}
function spawnWave(id){
  const wall=wallPool.pop();if(!wall)return;
  let Sp=dist+WAVE_DIST;Sp=Math.round((Sp-3)/6)*6+3;                        // wejście w połowie między stemplami
  const opts=shuffle([{a:cur.a,sub:cur.sub},...wrongOf(cur)]);
  const w={id,z:dist-Sp,resolved:false,nitro:false,wall,rings:wall.portals,passLane:-1};
  wall.g.position.z=w.z;wall.g.visible=true;
  wall.portals.forEach((r,i)=>{const o=opts[i]||opts[0];r.ans=o.a;r.sub=o.sub||'';r.lang=cur.aLang;r.state='in';r.t=0;r.lop=0;r.aim=r.aimT=0;relabel(r,'');r.label.style.opacity=0});
  waves.push(w);
}
// Fala rozstrzyga się raz — gdy przód wózka mija wejście (tor w chwili przejazdu, odcinek poprzednia → obecna pozycja).
function resolveWave(w,ln){
  if(w.resolved)return;
  w.resolved=true;w.passLane=ln;
  if(nitro.state==='boost')nitro.state='ease';
  const hit=w.rings[ln],good=w.rings.find(r=>r.ans===cur.a);
  if(hit===good){
    const gain=10+(combo>=2?5:0);
    score+=gain;combo++;winSound();speakSeq(cur.aSay);show("✓ DOBRZE!",true);hitFx('ok');
    scoreEl.textContent=score;comboEl.textContent=combo;
    for(const r of w.rings)setPortalState(r,r===hit?'ok':'gone');
    burstSparks(hit.x,OH+.6,w.z+.8,40,5,3,0,.9);
    addTotal(gain);
    nextRoundIn=.9;
    lastResolve={id:w.id,lane:ln,kind:'ok',ans:hit.ans,gain};
  }else{
    crash(w,hit,good);
    lastResolve={id:w.id,lane:ln,kind:'bad',ans:hit.ans};
  }
}
// Zły tunel: czerwone lampki, wstrząs, −1 życie, po chwili okno przepisywania (po 3. błędzie — potem Game Over).
function crash(w,r,good){
  run=false;crashing=true;crashT=0;combo=0;comboEl.textContent=0;shake=1;nitro.state='off';nextRoundIn=0;
  lives=Math.max(0,lives-1);renderLives(true);noteErr(cur);
  crashSound();show("⚡ ZŁY TUNEL!",false);hitFx('bad');
  for(const o of w.rings)setPortalState(o,o===r?'bad':o===good?'hint':'gone');
  for(let i=0;i<4;i++)burstSparks(px+(i%2?.5:-.5),.3,i<2?-.6:.6,25,4,3,3,.8);
  srvFlush(false);
  const it=cur,badAns=r.ans;
  clearTimeout(crashTimer);crashTimer=setTimeout(()=>openRetype(it,badAns),1100);
}
function updateWaves(dt,dz,pxPrev){
  for(const w of waves){
    const zPrev=w.z;w.z+=dz;w.wall.g.position.z=w.z;
    if(!w.resolved&&w.id===roundId&&run&&!crashing&&zPrev<HIT_Z&&w.z>=HIT_Z){const f=dz>0?(HIT_Z-zPrev)/dz:1;resolveWave(w,nearestLane(pxPrev+(px-pxPrev)*f))}
    for(const r of w.rings)animPortal(r,w,dt);
  }
  for(let i=waves.length-1;i>=0;i--){const w=waves[i];if(w.z>TL+40){freeWall(w.wall);waves.splice(i,1)}}
  updatePortLights();
}
// Gdy kamera jest w tunelu albo tuż przed nim — oś tunelu (kamera nie wjeżdża w skałę)
function camTunnelX(zc){
  for(const w of waves){if(zc<w.z+3.5&&zc>w.z-TL-1.5)return laneX(w.passLane>=0?w.passLane:nearestLane(px))}
  return null;
}

/* ── porównanie odpowiedzi: bez wielkości liter, nadmiarowych spacji, różnic apostrofów i znaku na końcu ── */
const normAns=s=>String(s||'').normalize('NFC').toLowerCase().replace(/[’‘`´ʼ′]/g,"'").replace(/[“”„«»]/g,'"').replace(/[‐‑–—]/g,'-')
  .replace(/\s+/g,' ').trim().replace(/[\s.!?…]+$/,'');
const foldAns=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const PL_CH=/[ąćęłńóśźż]/;

function checkRetype(){
  if(!rtItem||rtDone)return;
  const a=normAns(rtIn.value),b=normAns(rtItem.a);
  rtIn.classList.remove('bad');void rtIn.offsetWidth;
  if(!a){rtMsg('Wpisz odpowiedź z zielonej ramki.','warn');rtIn.focus();return}
  if(a===b){rtDone=true;rtIn.classList.add('good');rtMsg('✓ Dobrze!','ok');winSound();setTimeout(closeRetype,550);return}
  rtIn.classList.add('bad');missSound();
  if(foldAns(a)===foldAns(b))rtMsg(PL_CH.test(a+b)?'Prawie! Uważaj na polskie znaki (ą, ę, ł, ó…).':'Prawie! Uważaj na znaki z kreską (é, è, à, ü…).','warn');
  else{
    let i=0;while(i<a.length&&i<b.length&&a[i]===b[i])i++;
    const unit=rtItem.num?'cyfr':'liter',unit1=rtItem.num?'cyfrę':'literę';
    rtMsg(i===a.length?`Brakuje jeszcze ${unit} — dopisz resztę.`:i===b.length?`Za dużo ${unit} — usuń końcówkę.`:`Jeszcze nie! Sprawdź ${unit1} nr ${i+1}.`,'bad');
  }
  rtIn.focus();
}

function gameOver(){

  if(paused)closePicker();

    <div class="ovCart">${cartProgHtml()}</div>${BACK_ROW}`;

function buildQuiz(){
  const list=[],ks=new Set();
  for(const it of shuffle(errItems))if(!ks.has(it.k)&&list.length<QZ_N){ks.add(it.k);list.push(it)}   // najpierw pytania z błędem…
  for(let g=0;list.length<QZ_N&&g<300;g++){const it=genItem(false);if(!ks.has(it.k)||g>200){ks.add(it.k);list.push(it)}}   // …potem losowe z tego trybu
  return list.map(it=>{const opts=shuffle([{a:it.a,sub:it.sub},...wrongOf(it)]);return {it,opts,ans:opts.findIndex(o=>o.a===it.a)}});
}
function startQuiz(){
  clearTimeout(QZ.t);
  QZ.qs=buildQuiz();QZ.i=0;QZ.ok=0;QZ.wrong=[];QZ.lock=false;
  if(!QZ.qs.length){replayOk=true;gameOver();return}
  QZ.on=true;quizQ();
}
function quizQ(){
  const q=QZ.qs[QZ.i],n=QZ.qs.length,it=q.it,qt=it.qShort||it.q;QZ.lock=false;
  ovCard().innerHTML=`<div class="qzhead"><span>📝 Quiz · pytanie ${QZ.i+1}/${n}</span><span class="qzok" aria-label="Dobre odpowiedzi: ${QZ.ok}">✓ ${QZ.ok}</span></div>
    <div class="qzbar"><i style="width:${(QZ.i/n*100).toFixed(1)}%"></i></div>
    <p class="qzq">${esc(it.qq)}</p>

    <div class="qzopts">${q.opts.map((o,i)=>`<button type="button" class="qopt" data-qi="${i}"><span class="qk" aria-hidden="true">${'ABC'[i]}</span><span class="qt" lang="${it.aLang}">${esc(o.a)}${o.sub?`<small lang="en">${esc(o.sub)}</small>`:''}</span><kbd class="qn" aria-hidden="true">${i+1}</kbd></button>`).join('')}</div>

    <div><button class="btn sm" type="button" data-act="next" hidden>Dalej ➜</button></div>
    <p class="hint">${COARSE?'Dotknij właściwej odpowiedzi.':'Kliknij odpowiedź albo naciśnij <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd>.'} Zaliczenie: min. ${QZ_PASS} z ${n}.</p>`;
  focusFirst('#qzWord');

}
function answerQuiz(i){
  const q=QZ.on&&QZ.qs[QZ.i];
  if(!q||QZ.lock||!(i>=0&&i<q.opts.length))return;
  QZ.lock=true;
  ovCard().querySelectorAll('.qopt').forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('bad')});
  const fb=document.getElementById('qzFb');
  speakSeq(q.it.aSay);
  if(i===q.ans){
    QZ.ok++;winSound();fb.textContent='✓ Dobrze!';fb.className='qzfb ok';
    const ok=ovCard().querySelector('.qzok');ok.textContent='✓ '+QZ.ok;ok.setAttribute('aria-label','Dobre odpowiedzi: '+QZ.ok);
    QZ.t=setTimeout(nextQuiz,1000);
  }else{
    missSound();QZ.wrong.push(q.it);noteErr(q.it);
    fb.innerHTML=`✗ Poprawnie: <b>${esc(q.it.qShort||q.it.q)}</b> → <b>${esc(q.it.a)}</b>`;fb.className='qzfb bad';
    const nb=ovCard().querySelector('[data-act="next"]');nb.hidden=false;nb.focus();
  }
}
function nextQuiz(){clearTimeout(QZ.t);if(!QZ.on)return;QZ.i++;if(QZ.i<QZ.qs.length)quizQ();else quizResult()}
function quizResult(){
  QZ.on=false;
  const n=QZ.qs.length,pass=QZ.ok>=Math.min(QZ_PASS,n);
  if(pass)replayOk=true;
  const seen=new Set(),rev=QZ.wrong.filter(it=>!seen.has(it.k)&&seen.add(it.k));
  const revHtml=rev.length?`<div class="qzrev"><b>Do powtórki:</b><br>${rev.map(it=>`${esc(it.qShort||it.q)} → <b>${esc(it.a)}</b>`).join('<br>')}</div>`:'';
  ovCard().innerHTML=pass
    ?`<h1>🎉 ZALICZONE!</h1><p class="big">${QZ.ok}/${n}</p><p>Brawo! Możesz znowu jechać — znowu masz 3 życia.</p>${revHtml}
      ${againRow()}<div class="ovCart">${cartProgHtml()}</div>${BACK_ROW}`
    :`<h1>📝 JESZCZE RAZ</h1><p class="big">${QZ.ok}/${n}</p><p>Potrzeba min. ${QZ_PASS} dobrych odpowiedzi. Spróbuj jeszcze raz — będą nowe pytania.</p>${revHtml}

  focusFirst(pass?'[data-act="again"]':'[data-act="quiz"]');
}

function updateFx(dt,dz,gas,brake){

  FX.flameO.uniforms.uK.value=FX.flameI.uniforms.uK.value=.8+.2*bk;FX.flameO.uniforms.uT.value=FX.flameI.uniforms.uT.value=T;

  while(sparkAcc>1){sparkAcc--;const sx=Math.random()<.5?-1:1,sz=Math.random()<.5?-1:1;spark(px+sx*GAUGE/2,.27,sz*player.wz,sx*Math.random()*1.4,1+Math.random()*2.4,2+Math.random()*4,.3+Math.random()*.4)}
  if(bk>.1&&Math.random()<bk*.7){chimWorld(_cw);spark(_cw.x,_cw.y,_cw.z,(Math.random()-.5)*1.5,3+Math.random()*4,1+Math.random()*2,.6+Math.random()*.5)}

  const bc=Math.round(bk*(post?55:100))/100;if(bc!==boostCss){boostCss=bc;boostEl.style.opacity=bc}

// świecące szyny od wózka do wejścia tunelu na torze, na który prowadzi zwrotnica (nie wskazują dobrej odpowiedzi)

  const w=curWave(),on=!!w&&run&&!crashing&&!held&&!paused&&!w.resolved&&w.z<HIT_Z-2;

}

/* ── napisy na tablicach: jedna fala = jeden rząd (kolejność torów), rozsuwane, gdy nachodzą; kreska do tablicy ── */
const _lv={};
function hideLbl(r){r.label.style.opacity=0;r.lead.style.opacity=0}
function placeLabels(){
  const W=innerWidth,H=innerHeight,v3=_lv.v||(_lv.v=new THREE.Vector3());
  for(const w of waves){
    const items=[];
    for(const r of w.rings){
      if(r.state==='off'){hideLbl(r);continue}
      v3.set(r.x,BOARD_Y,w.z+.25);
      const d=camera.position.distanceTo(v3);
      v3.applyMatrix4(camera.matrixWorldInverse);
      if(v3.z>-.5||d>330){hideLbl(r);continue}
      v3.applyMatrix4(camera.projectionMatrix);
      const op=Math.min(1,(330-d)/70)*clamp((d-8)/7,0,1)*r.lop;                // z bliska widać już tablicę 3D
      if(op<=.01){hideLbl(r);continue}
      r.label.classList.toggle('aim',r.aim>.5&&(r.state==='in'||r.state==='idle'));
      items.push({r,ax:(v3.x*.5+.5)*W,ay:(-v3.y*.5+.5)*H,sc:Math.max(1.05,Math.min(1.35,46/d))*(1+.12*r.aim),op,bw:+r.label.dataset.w||120,bh:+r.label.dataset.h||40});
    }
    if(!items.length)continue;
    items.sort((a,b)=>a.ax-b.ax);
    const gap=8,margin=10,n=items.length;
    const tot=items.reduce((s,it)=>s+it.bw*it.sc,0);
    if(tot+gap*(n-1)>W-2*margin){const f=(W-2*margin-gap*(n-1))/tot;items.forEach(it=>it.sc*=f)}
    items.forEach(it=>{it.w=it.bw*it.sc;it.h=it.bh*it.sc});
    const xs=items.map(it=>it.ax);
    for(let i=1;i<n;i++){const mn=xs[i-1]+(items[i-1].w+items[i].w)/2+gap;if(xs[i]<mn)xs[i]=mn}
    const shift=(items.reduce((s,it)=>s+it.ax,0)-xs.reduce((s,x)=>s+x,0))/n;
    for(let i=0;i<n;i++)xs[i]+=shift;
    const lft=xs[0]-items[0].w/2,rgt=xs[n-1]+items[n-1].w/2;
    if(lft<margin)for(let i=0;i<n;i++)xs[i]+=margin-lft;
    else if(rgt>W-margin)for(let i=0;i<n;i++)xs[i]-=rgt-(W-margin);
    const mh=Math.max(...items.map(it=>it.h));
    const base=Math.max(mh/2+4,Math.min(...items.map(it=>it.ay))-mh*.18,Math.min(hudBottom+mh/2+6,H*.6));   // rząd napisów nie wchodzi pod tablicę z pytaniem
    items.forEach((it,i)=>{
      const s=it.r.label.style;s.opacity=it.op.toFixed(3);
      s.transform=`translate(${xs[i].toFixed(1)}px,${base.toFixed(1)}px) translate(-50%,-50%) scale(${it.sc.toFixed(3)})`;
      const ln=it.r.lead;
      if(Math.abs(xs[i]-it.ax)>it.w*.3){ln.setAttribute('x1',xs[i].toFixed(1));ln.setAttribute('y1',(base+it.h/2-2).toFixed(1));ln.setAttribute('x2',it.ax.toFixed(1));ln.setAttribute('y2',it.ay.toFixed(1));ln.style.opacity=(it.op*.85).toFixed(3)}
      else ln.style.opacity=0;
    });
  }
}

/* ── pętla gry ── */
function loop(){
  requestAnimationFrame(loop);
  const raw=clock.getDelta();
  perfTick(raw);
  update(Math.min(.05,raw));
  render();
}
function render(){
  if(post){post.blur.enabled=boostK>.003;post.blur.uniforms.uK.value=boostK;post.comp.render()}
  else renderer.render(scene,camera);
}
function updateWorld(dt,dz){
  const sh=smod(dist);
  tun.position.z=sh;MU.uSh.value=sh;MU.uT.value=T%(200*Math.PI);
  const tt=MU.uT.value,c=_v1.c||(_v1.c=new THREE.Color());
  for(let i=0;i<lampKs.length;i++){const f=flk(lampKs[i],tt);c.setRGB(2.6*f,1.6*f,.7*f);bulbs.setColorAt(i,c)}
  bulbs.instanceColor.needsUpdate=true;
  // kurz w powietrzu
  const pos=dust.geometry.attributes.position;
  for(let i=0;i<dustData.length;i++){const o=dustData[i];o.z+=dz;if(o.z>8){o.z-=78;o.x=(Math.random()-.5)*14}
    pos.setXYZ(i,o.x+Math.sin(T*.3+o.ph)*.3,o.y+Math.sin(T*.5+o.ph*2)*.15,o.z)}
  pos.needsUpdate=true;
  dustMat.uniforms.uC.value.setRGB(.55+boostK*.6,.42+boostK*.4,.28+boostK*.2);
  // rozjazdy przewijane ze światem, dźwignie przestawiają się
  for(const o of xoPool)if(o.on){o.g.position.z=dist-o.S0;o.t+=dt;const k=Math.min(1,o.t/.2);o.arm.rotation.z=o.dir*.55*(1-2*(k*k*(3-2*k)));if(dist-o.S1>30&&!plans.some(p=>p.xo===o))freeXover(o)}
}
function update(dt){
  dt=Math.min(MAX_DT,Math.max(0,dt||0));
  if(paused){updateShowroom(dt);return}
  if(held){tickCountdown(dt);placeLabels();updateNitroUi();updateMano(dt);rumbleSet(0,150);return}
  T+=dt;
  const up=keys.ArrowUp||keys.w, down=keys.ArrowDown||keys.s;
  // ── prędkość: szybciej / wolniej / tempo jazdy / zrzut węgla ──
  prevV=v;
  if(crashing){v=Math.max(0,v-Math.max(30,v*3.5)*dt);crashT+=dt;nitro.state='off'}
  else if(run){
    const vT=up?V_MAX:down?V_MIN:V_CRUISE;
    if(nitro.state==='boost'){v=Math.min(NITRO_V,v+NITRO_ACC*dt);nitro.t+=dt;if(nitro.t>6)nitro.state='ease'}
    else if(nitro.state==='ease'){v=vT+(v-vT)*Math.exp(-NITRO_EASE*dt);if(v-vT<.8)nitro.state='off'}
    else{const acc=vT>v?(up?6.5:4):(down?12:5);v+=Math.sign(vT-v)*Math.min(Math.abs(vT-v),acc*dt)}
    raceT+=dt;
  }
  else{v+=(9-v)*Math.min(1,dt*.8);nitro.state='off'}
  boostK=clamp((v-V_MAX)/(NITRO_V-V_MAX),0,1);
  document.body.classList.toggle('boost',!!(run&&up)||boostK>.05);
  speedEl.textContent=Math.round(v*3.6);
  const ts=Math.floor(raceT);if(ts!==timeLast){timeLast=ts;timeEl.textContent=fmtTime(ts)}
  const pxPrev=px;
  dist+=v*dt;flowS+=(v+15)*dt;
  const dz=v*dt;
  // ── tory: oś wózka z rozjazdów, odchylenie i przechył na łuku, bujanie i stukot na łączeniach szyn ──
  const dxs=trackPos();
  yaw+=(-Math.atan(dxs)-yaw)*Math.min(1,dt*18);
  roll+=(clamp(latA*.0045,-.13,.13)-roll)*Math.min(1,dt*9);
  const jf=Math.floor((dist+player.wz)/12),jr=Math.floor((dist-player.wz)/12);
  if(jf!==jointF){jointF=jf;bumpF=.07;if(v<70)clackSound(Math.min(1,v/28))}
  if(jr!==jointR){jointR=jr;bumpR=.07;if(v<70)setTimeout(()=>clackSound(Math.min(1,v/28)*.8),15)}
  bumpF=Math.max(0,bumpF-dt);bumpR=Math.max(0,bumpR-dt);
  const R=player.root,B=player.body;
  R.position.set(px,0,0);R.rotation.set(0,yaw,0);
  B.rotation.set((bumpF-bumpR)*.22+clamp((v-prevV)/Math.max(dt,1e-3)*-.0012,-.03,.03),0,roll);
  B.position.y=-(bumpF+bumpR)*.25+Math.sin(T*19)*.004*Math.min(1,v/20);
  if(crashing){const k=Math.max(0,1-crashT);B.rotation.z+=Math.sin(crashT*30)*.08*k;B.position.y+=Math.abs(Math.sin(crashT*24))*.06*k}
  for(const wg of player.wheels)wg.rotation.x=-(dist/WHEEL_R)%TAU;
  R.updateMatrixWorld(true);

  updateWorld(dt,dz);
  updateWaves(dt,dz,pxPrev);
  updateGuide(dt);
  if(nextRoundIn>0){nextRoundIn-=dt;if(nextRoundIn<=0&&run&&!crashing)newRound()}
  updateParticles(dt,dz);
  updateShovel(dt);

  // ── kamera za wózkiem (nisko, lekko z góry); w tunelu na osi toru; szerszy kadr przy zrzucie węgla ──
  shake=Math.max(0,shake-dt*1.6);fovKick=Math.max(0,fovKick-dt*2.2);
  const vv=Math.min(v,V_MAX),portrait=camera.aspect<.8;
  let tx=px*.82,kx=1-Math.exp(-dt*6);
  const tunX=camTunnelX(camera.position.z);if(tunX!==null){tx=tunX;kx=1-Math.exp(-dt*16)}
  let ty=2.75+vv*.006-boostK*.25;const tz=5.5+vv*.03+boostK*.6;
  if(tunX!==null)ty=Math.min(ty,OH-.45);
  const k=1-Math.exp(-dt*6),kl=1-Math.exp(-dt*12);
  camera.position.x+=(tx-camera.position.x)*kx;camera.position.y+=(ty-camera.position.y)*k;camera.position.z+=(tz-camera.position.z)*k;
  const sh=shake*.4+boostK*.07;
  if(sh>.001){camera.position.x+=(Math.random()-.5)*sh*(tunX!==null?.4:1);camera.position.y+=(Math.random()-.5)*sh*.6}
  camLook.x+=((tunX!==null?tunX:px*.9)-camLook.x)*kl;camLook.y+=(1.2-camLook.y)*kl;camLook.z+=(-18-camLook.z)*kl;
  camera.lookAt(camLook.x,camLook.y,camLook.z);
  camRoll+=((roll*.4)-camRoll)*Math.min(1,dt*5);camera.rotateZ(camRoll);
  setFov((portrait?78:62)+Math.min(7,Math.max(0,v-V_CRUISE)*.4)+boostK*(portrait?10:15)+fovKick*6,k);
  camera.updateMatrixWorld();
  if(post){const vp=_v1.vp||(_v1.vp=new THREE.Vector3());vp.set(camera.position.x,1.5,camera.position.z-300).project(camera);post.blur.uniforms.uC.value.set(vp.x*.5+.5,clamp(vp.y*.5+.5,.35,.75))}
  updateFx(dt,dz,!!(run&&up),!!(run&&down&&v>V_MIN+2));
  updateNitroUi();updateMano(dt);
  placeLabels();
  rumbleSet(run?.025+.05*Math.min(1,v/V_MAX)+boostK*.07:crashing?.03:0,140+boostK*600);
}
// Gra wstrzymana (wybór wózka): kamera z boku z przodu, żeby było widać wybrany model (w tunelu — z tyłu, bliżej).
function updateShowroom(dt){
  const k=1-Math.exp(-dt*3.5),portrait=camera.aspect<.8;
  T+=dt*.5;
  let tx,ty,tz,lx,ly,lz;
  if(cartInTunnel()||camTunnelX(camera.position.z)!==null){tx=px;ty=2.1;tz=3.8;lx=px;ly=1.5;lz=-2}
  else{const side=px>0?-1:1;tx=px+side*(portrait?3.2:4.4);ty=portrait?3.4:2.7;tz=portrait?-7.4:-6.2;lx=px;ly=portrait?3.0:2.15;lz=-.2}
  camera.position.x+=(tx-camera.position.x)*k;camera.position.y+=(ty-camera.position.y)*k;camera.position.z+=(tz-camera.position.z)*k;
  camLook.x+=(lx-camLook.x)*k;camLook.y+=(ly-camLook.y)*k;camLook.z+=(lz-camLook.z)*k;
  camera.lookAt(camLook.x,camLook.y,camLook.z);camRoll*=1-k;
  setFov(portrait?64:50,k);camera.updateMatrixWorld();
  player.root.position.set(px,0,0);player.root.rotation.y*=1-k;player.body.rotation.z*=1-k;player.root.updateMatrixWorld(true);
  MU.uT.value=T%(200*Math.PI);
  boostK=0;updateFx(dt,0,false,false);updateParticles(dt,0);updateGuide(dt);placeLabels();updateMano(dt);rumbleSet(0,150);
}

/* ── słówka z podręcznika ── */
function collectWords(bookId,unitKey){
  const b=BOOKS[bookId];if(!b||!b.units)return [];
  let raw=[];
  if(unitKey==='all'||!unitKey){Object.values(b.units).forEach(u=>{if(u&&u.words)u.words.forEach(w=>raw.push(w))})}
  else if(b.units[unitKey]&&b.units[unitKey].words){raw=[...b.units[unitKey].words]}
  const seen=new Set(),out=[];
  raw.forEach(w=>{const pl=(w[0]||'').trim(),en=(w[1]||'').trim();
    if(pl&&en&&!seen.has(en.toLowerCase())){seen.add(en.toLowerCase());out.push([pl,en])}});
  return out;
}

    <li>🗣️ Lektor czyta pytania i odpowiedzi (wyłączysz go przyciskiem u góry). Po 200 punktach odblokujesz <b>zmianę wózka</b>.</li>
  </ul>
  <div class="ovCart">${cartProgHtml()}</div>

}
function renderStartCard(){
  QZ.on=false;run=false;overlay.style.display='grid';document.body.classList.remove('racing');

  fillBooks();
  const bs=document.getElementById('bookSel');

function updateModeUi(){
  ovCard().querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===MODE)));

function refreshStartBtn(){const b=document.getElementById('start');if(!b)return;b.disabled=!R3.ready;b.textContent=R3.ready?'⛏️ START':'⏳ Ładowanie 3D…'}
function fillBooks(){
  const bs=document.getElementById('bookSel');if(!bs)return;
  const ids=Object.keys(BOOKS).filter(id=>BOOKS[id]&&BOOKS[id].units);
  bs.innerHTML='<option value="">— wybierz —</option>'+ids.map(id=>`<option value="${id}">${esc((BOOKS[id].icon||'📘')+' '+(BOOKS[id].name||id))}</option>`).join('');

function fillUnits(){
  const bId=document.getElementById('bookSel').value,us=document.getElementById('unitSel');
  if(!bId||!BOOKS[bId]){us.innerHTML='';us.disabled=true;return}
  const units=BOOKS[bId].units||{};
  let html='<option value="all">🌍 Wszystkie rozdziały</option>';
  Object.keys(units).forEach(uk=>{if(uk==='all')return;const u=units[uk];html+=`<option value="${uk}">${esc((u.icon?u.icon+' ':'')+(u.name||uk))}</option>`});
  us.innerHTML=html;us.disabled=false;

function beginFromCard(){
  if(!R3.ready)return;
  const err=document.getElementById('cErr');
  if(MODE==='words'){
    const b=document.getElementById('bookSel').value,u=document.getElementById('unitSel').value||'all';
    if(!b){err.textContent='Wybierz podręcznik 📚';document.getElementById('bookSel').focus();return}
    const W=collectWords(b,u);if(W.length<3){err.textContent='Ten rozdział ma za mało słówek (potrzeba min. 3).';return}
    WORDS=W;BOOK_ID=b;UNIT_KEY=u;

  }else if(MODE==='math')MATH_LV=document.getElementById('mathSel').value||'mul';

overlay.addEventListener('click',e=>{

});

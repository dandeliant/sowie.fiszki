<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Egzaminy — Sowie Fiszki</title>
<meta name="description" content="Platforma egzaminacyjna Sowich Fiszek: Egzamin Ósmoklasisty i Matura z języka angielskiego — teoria i ćwiczenia do każdego zagadnienia.">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2fb; --bg2:#e6ecfa; --card:#ffffff; --ink:#1e2540; --muted:#6b7590; --border:#e2e8f5;
    --accent:#6c4dff; --accent2:#a855f7; --e8:#3b82f6; --matura:#7c3aed; --ok:#16a34a; --no:#dc2626;
    --shadow:0 14px 40px rgba(40,40,90,.14); --shadow-sm:0 6px 18px rgba(40,40,90,.10);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0f1226; --bg2:#141834; --card:#1a1f3c; --ink:#e8ebff; --muted:#9aa3c7; --border:#2a3157; --shadow:0 14px 40px rgba(0,0,0,.45); --shadow-sm:0 6px 18px rgba(0,0,0,.35); }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);min-height:100vh;
    background:
      radial-gradient(1100px 560px at 8% -8%,rgba(108,77,255,.16),transparent 60%),
      radial-gradient(1000px 520px at 108% 4%,rgba(59,130,246,.14),transparent 55%),
      linear-gradient(160deg,var(--bg),var(--bg2));
    background-attachment:fixed;}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1000px;margin:0 auto;padding:18px 16px 60px}

  /* Topbar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;cursor:pointer}
  .brand .owl{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:1.3rem;
    background:linear-gradient(135deg,#ff6b6b,#ffa94d);box-shadow:var(--shadow-sm)}
  .home-link{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:8px 15px;font-weight:800;font-size:.85rem;box-shadow:var(--shadow-sm);transition:transform .15s}
  .home-link:hover{transform:translateY(-1px)}

  /* Breadcrumb */
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);font-weight:700;margin:6px 0 16px}
  .crumbs a{padding:3px 9px;border-radius:8px;background:var(--card);border:1px solid var(--border);transition:all .15s}
  .crumbs a:hover{color:var(--accent);border-color:var(--accent)}
  .crumbs .sep{opacity:.5}

  /* Hero */
  .hero{text-align:center;padding:26px 12px 8px}
  .hero h1{font-family:'Playfair Display',serif;font-size:clamp(2rem,6vw,3.1rem);line-height:1.05;
    background:linear-gradient(120deg,var(--accent),var(--accent2),var(--e8));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hero p{color:var(--muted);font-weight:700;font-size:1rem;margin-top:10px;max-width:560px;margin-inline:auto}

  /* Choice tiles */
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:24px}
  .tile{position:relative;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:26px 22px;
    box-shadow:var(--shadow);cursor:pointer;overflow:hidden;transition:transform .18s,box-shadow .18s}
  .tile:hover{transform:translateY(-4px);box-shadow:0 22px 50px rgba(40,40,90,.20)}
  .tile::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--tc,var(--accent))}
  .tile .t-emoji{font-size:2.6rem;line-height:1}
  .tile h2{font-size:1.4rem;margin:12px 0 6px}
  .tile .t-sub{color:var(--muted);font-weight:700;font-size:.9rem;line-height:1.4}
  .tile .t-go{margin-top:16px;display:inline-flex;align-items:center;gap:6px;font-weight:900;color:var(--tc,var(--accent))}
  .tile .t-badge{position:absolute;top:16px;right:16px;font-size:.68rem;font-weight:900;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--accent)) 14%,transparent);color:var(--tc,var(--accent))}

  /* Section head */
  .sec-head{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
  .sec-head .dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .sec-head h3{font-size:1.05rem;font-weight:900}
  .sec-head .count{color:var(--muted);font-weight:800;font-size:.8rem}

  /* Topic list */
  .cat{margin-bottom:20px}
  .cat-title{display:flex;align-items:center;gap:9px;font-weight:900;font-size:1.05rem;margin:0 2px 10px}
  .cat-title .c-emoji{font-size:1.3rem}
  .topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
  .topic{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:12px 14px;cursor:pointer;transition:all .15s;box-shadow:var(--shadow-sm)}
  .topic:hover{transform:translateY(-2px);border-color:var(--accent)}
  .topic .tk{flex:1;font-weight:800;font-size:.92rem;line-height:1.25}
  .topic .st{flex:none;font-size:.62rem;font-weight:900;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .topic .st.ready{background:rgba(22,163,74,.14);color:var(--ok)}
  .topic .st.soon{background:rgba(107,117,144,.14);color:var(--muted)}
  .topic .done{color:var(--ok);font-size:1rem}

  .searchbar{width:100%;padding:12px 16px;border-radius:14px;border:1.5px solid var(--border);background:var(--card);color:var(--ink);
    font-family:inherit;font-weight:700;font-size:.95rem;margin-bottom:16px;box-shadow:var(--shadow-sm)}
  .searchbar:focus{outline:none;border-color:var(--accent)}

  /* Tasks panel (typy zadań) */
  .tasks-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow-sm);margin-top:18px}
  .tasks-box h3{margin-bottom:12px}
  .tgroup{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
  .tgroup b{display:block;margin-bottom:6px}
  .tgroup .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:.72rem;font-weight:800;padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}

  /* Topic detail */
  .detail{background:var(--card);border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:var(--shadow);margin-top:6px}
  .detail .d-emoji{font-size:2.4rem}
  .detail h1{font-size:1.7rem;margin:8px 0 2px}
  .detail .d-sub{color:var(--muted);font-weight:800;font-size:.9rem;margin-bottom:18px}
  .th-lead{background:color-mix(in srgb,var(--accent) 8%,transparent);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0;font-weight:700;line-height:1.5}
  .th-h{font-size:1rem;font-weight:900;margin:18px 0 8px;color:var(--accent2)}
  .th-ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin:6px 0}
  .th-ul li{position:relative;padding-left:22px;line-height:1.45;font-weight:600}
  .th-ul li::before{content:'▸';position:absolute;left:4px;color:var(--accent);font-weight:900}
  .th-form{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:12px;padding:12px 14px;margin:8px 0;border:1px solid var(--border)}
  .th-form-row{font-weight:800;font-family:'Nunito';font-size:.95rem}
  .th-ex{display:flex;flex-direction:column;gap:1px;background:var(--bg);border-radius:10px;padding:9px 12px;margin:6px 0;border:1px solid var(--border)}
  .th-en{font-weight:800}
  .th-pl{color:var(--muted);font-weight:700;font-size:.86rem}
  .th-tip{background:rgba(246,174,45,.12);border:1px solid rgba(246,174,45,.35);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:700;line-height:1.5}
  .th-star{font-weight:800;margin:6px 0;color:var(--accent)}
  .th-signal{background:var(--bg);border-radius:8px;padding:7px 12px;font-weight:800;border:1px dashed var(--border)}
  .soon-box{background:var(--bg);border:1px dashed var(--border);border-radius:14px;padding:20px;text-align:center;color:var(--muted);font-weight:700;line-height:1.5;margin-top:8px}

  /* Exercises */
  .exs{margin-top:24px}
  .exs-h{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.1rem;margin-bottom:12px}
  .task{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
  .task .q{font-weight:800;margin-bottom:10px;line-height:1.5}
  .task input[type=text]{width:100%;max-width:320px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-weight:700}
  .task input:focus{outline:none;border-color:var(--accent)}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{padding:9px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--ink);font-family:inherit;font-weight:800;cursor:pointer;transition:all .12s}
  .opt:hover{border-color:var(--accent)}
  .opt.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
  .opt.correct{background:rgba(22,163,74,.18);border-color:var(--ok);color:var(--ok)}
  .opt.wrong{background:rgba(220,38,38,.14);border-color:var(--no);color:var(--no)}
  .task .row2{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .fb{font-weight:800;font-size:.9rem}
  .fb.ok{color:var(--ok)}.fb.no{color:var(--no)}
  .fb .hint{color:var(--muted);font-weight:700;display:block;margin-top:2px}
  button{font-family:inherit;font-weight:800;border:none;border-radius:10px;padding:9px 15px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow-sm);transition:transform .12s}
  button:hover{transform:translateY(-1px)}
  button.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--border);box-shadow:none}
  .done-btn{margin-top:18px}
  .done-btn.is-done{background:linear-gradient(135deg,#16a34a,#22c55e)}

  .footer{text-align:center;color:var(--muted);font-weight:700;font-size:.78rem;margin-top:30px}
  @media print{.home-link,.searchbar,button,.opt{display:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand" data-go="/egzaminy"><span class="owl">🦉</span><span>Sowie Fiszki · Egzaminy</span></div>
    <a class="home-link" href="/app.html">← Aplikacja</a>
  </div>
  <div id="crumbs" class="crumbs"></div>
  <div id="app"></div>
  <div class="footer">© 2026 Sowie Fiszki · Platforma egzaminacyjna</div>
</div>

<script src="/egzaminy-data.js"></script>
<script>
(function(){
  'use strict';
  const D = window.EGZ_DATA;
  const app = document.getElementById('app');
  const crumbsEl = document.getElementById('crumbs');
  const BASE = '/egzaminy';
  const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── postęp (localStorage) ──
  function doneSet(){ try{ return new Set(JSON.parse(localStorage.getItem('egz_done')||'[]')); }catch(e){ return new Set(); } }
  function isDone(id){ return doneSet().has(id); }
  function toggleDone(id){ const s=doneSet(); if(s.has(id))s.delete(id); else s.add(id); try{localStorage.setItem('egz_done',JSON.stringify([...s]));}catch(e){} }

  // ── znajdź temat po id ──
  function allTopics(){
    const out=[];
    (D.e8.cats||[]).forEach(c=>c.topics.forEach(t=>out.push({t,catName:c.name,scope:D.e8,scopePath:BASE+'/e8/angielski'})));
    ['podstawa','rozszerzenie'].forEach(lv=>{ (D.matura[lv].cats||[]).forEach(c=>c.topics.forEach(t=>out.push({t,catName:c.name,scope:D.matura[lv],scopePath:BASE+'/matura/angielski/'+lv}))); });
    return out;
  }
  function findTopic(id){ return allTopics().find(x=>x.t.id===id) || null; }

  // ── nawigacja ──
  function go(path){ if(location.pathname!==path){ history.pushState({},'',path); } render(); window.scrollTo({top:0,behavior:'smooth'}); }
  window.addEventListener('popstate', render);
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-go]'); if(!el) return;
    e.preventDefault(); go(el.getAttribute('data-go'));
  });

  // ── breadcrumbs ──
  function setCrumbs(items){
    crumbsEl.innerHTML = items.map((it,i)=>{
      const sep = i<items.length-1 ? '<span class="sep">/</span>' : '';
      return (it.path ? `<a data-go="${it.path}">${esc(it.label)}</a>` : `<span>${esc(it.label)}</span>`) + sep;
    }).join('');
  }

  // ── widoki ──
  function viewHome(){
    setCrumbs([{label:'Egzaminy'}]);
    app.innerHTML = `
      <div class="hero">
        <h1>Przygotuj się do egzaminu 🎓</h1>
        <p>Teoria i ćwiczenia do każdego zagadnienia — jasno, kolorowo i po kolei. Wybierz swój egzamin:</p>
      </div>
      <div class="tiles">
        <div class="tile" style="--tc:var(--e8)" data-go="${BASE}/e8">
          <div class="t-badge">Klasa 8</div>
          <div class="t-emoji">📘</div>
          <h2>Egzamin Ósmoklasisty</h2>
          <div class="t-sub">Gramatyka i typy zadań z języka angielskiego.</div>
          <div class="t-go">Wejdź ➜</div>
        </div>
        <div class="tile" style="--tc:var(--matura)" data-go="${BASE}/matura">
          <div class="t-badge">Liceum · Technikum</div>
          <div class="t-emoji">🎓</div>
          <h2>Matura</h2>
          <div class="t-sub">Poziom podstawowy i rozszerzony z języka angielskiego.</div>
          <div class="t-go">Wejdź ➜</div>
        </div>
      </div>`;
  }

  function viewE8(){
    setCrumbs([{label:'Egzaminy',path:BASE},{label:'Egzamin Ósmoklasisty'}]);
    app.innerHTML = `
      <div class="hero"><h1>📘 Egzamin Ósmoklasisty</h1><p>Wybierz przedmiot:</p></div>
      <div class="tiles">
        <div class="tile" style="--tc:var(--e8)" data-go="${BASE}/e8/angielski">
          <div class="t-emoji">🇬🇧</div><h2>Język angielski</h2>
          <div class="t-sub">Zagadnienia gramatyczne + typy zadań egzaminacyjnych.</div>
          <div class="t-go">Zobacz zagadnienia ➜</div>
        </div>
      </div>`;
  }

  function viewMatura(){
    setCrumbs([{label:'Egzaminy',path:BASE},{label:'Matura'}]);
    app.innerHTML = `
      <div class="hero"><h1>🎓 Matura</h1><p>Wybierz przedmiot:</p></div>
      <div class="tiles">
        <div class="tile" style="--tc:var(--matura)" data-go="${BASE}/matura/angielski">
          <div class="t-emoji">🇬🇧</div><h2>Język angielski</h2>
          <div class="t-sub">Poziom podstawowy (B1+) i rozszerzony (B2+).</div>
          <div class="t-go">Wybierz poziom ➜</div>
        </div>
      </div>`;
  }

  function viewMaturaLevels(){
    setCrumbs([{label:'Egzaminy',path:BASE},{label:'Matura',path:BASE+'/matura'},{label:'Język angielski'}]);
    app.innerHTML = `
      <div class="hero"><h1>🇬🇧 Matura — angielski</h1><p>Wybierz poziom:</p></div>
      <div class="tiles">
        <div class="tile" style="--tc:var(--ok)" data-go="${BASE}/matura/angielski/podstawa">
          <div class="t-badge">B1+</div><div class="t-emoji">🟢</div><h2>Poziom podstawowy</h2>
          <div class="t-sub">Środki językowe B1+ · wypowiedź 100–150 wyrazów.</div>
          <div class="t-go">Zagadnienia ➜</div>
        </div>
        <div class="tile" style="--tc:var(--matura)" data-go="${BASE}/matura/angielski/rozszerzenie">
          <div class="t-badge">B2+</div><div class="t-emoji">🟣</div><h2>Poziom rozszerzony</h2>
          <div class="t-sub">Środki językowe B2+ · wypowiedź 200–250 wyrazów.</div>
          <div class="t-go">Zagadnienia ➜</div>
        </div>
      </div>`;
  }

  function topicCard(t){
    const ready = !!(t.k && D.th[t.k]);
    const done = isDone(t.id);
    return `<div class="topic" data-go="${BASE}/zagadnienie/${t.id}">
      <span class="tk">${esc(t.t)}</span>
      ${done?'<span class="done" title="Przerobione">✓</span>':''}
      <span class="st ${ready?'ready':'soon'}">${ready?'teoria':'wkrótce'}</span>
    </div>`;
  }

  function renderTopicList(scope, crumbs){
    setCrumbs(crumbs);
    const total = scope.cats.reduce((s,c)=>s+c.topics.length,0);
    let html = `<div class="hero" style="padding-bottom:0"><h1>${scope.emoji||''} ${esc(scope.title)}${scope.subject?' — '+esc(scope.subject):''}</h1>`;
    if(scope.intro) html += `<p>${esc(scope.intro)}</p>`;
    html += `</div>`;
    html += `<input class="searchbar" id="tsearch" placeholder="🔎 Szukaj zagadnienia..." oninput="window.__egzFilter()">`;
    html += `<div class="sec-head"><span class="dot"></span><h3>Zagadnienia</h3><span class="count">${total} tematów</span></div>`;
    html += `<div id="catwrap">` + scope.cats.map(c=>`
      <div class="cat" data-cat>
        <div class="cat-title"><span class="c-emoji">${c.emoji||'•'}</span> ${esc(c.name)}</div>
        <div class="topic-grid">${c.topics.map(topicCard).join('')}</div>
      </div>`).join('') + `</div>`;
    // typy zadań (tylko E8)
    if(scope.tasks){
      html += `<div class="tasks-box"><h3>📝 ${esc(scope.tasks.name)}</h3>` +
        scope.tasks.groups.map(g=>`<div class="tgroup"><b>${esc(g.name)}</b><div class="chips">${g.items.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('') +
        `</div>`;
    }
    app.innerHTML = html;
    window.__egzFilter = function(){
      const q = (document.getElementById('tsearch').value||'').toLowerCase().trim();
      document.querySelectorAll('#catwrap [data-cat]').forEach(cat=>{
        let any=false;
        cat.querySelectorAll('.topic').forEach(tp=>{
          const show = tp.querySelector('.tk').textContent.toLowerCase().includes(q);
          tp.style.display = show?'':'none'; if(show)any=true;
        });
        cat.style.display = any?'':'none';
      });
    };
  }

  function viewTopic(id){
    const found = findTopic(id);
    if(!found){ go(BASE); return; }
    const t = found.t;
    const th = t.k ? D.th[t.k] : null;
    setCrumbs([{label:'Egzaminy',path:BASE},{label:found.scope.title||'',path:found.scopePath},{label:t.t}]);
    let html = `<div class="detail">
      <div class="d-emoji">📖</div>
      <h1>${esc(th?th.t:t.t)}</h1>
      <div class="d-sub">${esc((th&&th.sub)||found.catName)}</div>`;
    if(th){
      html += `<div class="theory">${th.html}</div>`;
    } else {
      html += `<div class="soon-box">✍️ Teoria do tego zagadnienia jest w przygotowaniu.<br>Wkrótce pojawi się tu pełne wyjaśnienie i ćwiczenia. Zajrzyj później!</div>`;
    }
    // ćwiczenia
    if(th && th.ex && th.ex.length){
      html += `<div class="exs"><div class="exs-h">🎯 Ćwiczenia</div><div id="tasks"></div>
        <button class="ghost" onclick="window.__egzCheckAll()">Sprawdź wszystko</button></div>`;
    }
    const done = isDone(id);
    html += `<div><button class="done-btn ${done?'is-done':''}" id="doneBtn" onclick="window.__egzToggleDone('${id}')">${done?'✓ Przerobione':'Oznacz jako przerobione'}</button></div>`;
    html += `</div>`;
    app.innerHTML = html;
    if(th && th.ex) renderTasks(th.ex);
  }

  // ── silnik ćwiczeń ──
  const norm = s => String(s||'').toLowerCase().replace(/[’']/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'').trim();
  function renderTasks(tasks){
    const box = document.getElementById('tasks');
    box.innerHTML = tasks.map((t,i)=>{
      if(t.type==='mc'){
        return `<div class="task" data-i="${i}"><div class="q">${i+1}. ${esc(t.q)}</div>
          <div class="opts">${t.opts.map(o=>`<button class="opt" data-opt="${esc(o)}" onclick="window.__egzPick(${i},this)">${esc(o)}</button>`).join('')}</div>
          <div class="row2"><span class="fb" data-fb></span></div></div>`;
      }
      return `<div class="task" data-i="${i}"><div class="q">${i+1}. ${esc(t.q)}</div>
        <input type="text" placeholder="Wpisz odpowiedź..." onkeydown="if(event.key==='Enter')window.__egzCheck(${i})">
        <div class="row2"><button onclick="window.__egzCheck(${i})">Sprawdź</button><span class="fb" data-fb></span></div></div>`;
    }).join('');
    window.__egzTasks = tasks;
  }
  function fbEl(i){ return document.querySelector(`.task[data-i="${i}"] [data-fb]`); }
  window.__egzPick = function(i, btn){
    const t = window.__egzTasks[i]; const correct = norm(btn.dataset.opt)===norm(t.a);
    const task = btn.closest('.task');
    task.querySelectorAll('.opt').forEach(o=>{ o.classList.remove('sel','correct','wrong'); if(norm(o.dataset.opt)===norm(t.a)) o.classList.add('correct'); });
    if(!correct) btn.classList.add('wrong');
    fbEl(i).innerHTML = correct?'<span class="ok">✓ Dobrze!</span>':`<span class="no">✗ Poprawnie: <b>${esc(t.a)}</b></span>`+(t.hint?`<span class="hint">💡 ${esc(t.hint)}</span>`:'');
  };
  window.__egzCheck = function(i){
    const t = window.__egzTasks[i]; const inp = document.querySelector(`.task[data-i="${i}"] input`);
    const ok = norm(inp.value)===norm(t.a);
    inp.style.borderColor = ok?'var(--ok)':'var(--no)';
    fbEl(i).innerHTML = ok?'<span class="ok">✓ Dobrze!</span>':`<span class="no">✗ Poprawnie: <b>${esc(t.a)}</b></span>`+(t.hint?`<span class="hint">💡 ${esc(t.hint)}</span>`:'');
  };
  window.__egzCheckAll = function(){
    (window.__egzTasks||[]).forEach((t,i)=>{ if(t.type!=='mc') window.__egzCheck(i); });
  };
  window.__egzToggleDone = function(id){ toggleDone(id); const b=document.getElementById('doneBtn'); const d=isDone(id); b.classList.toggle('is-done',d); b.textContent=d?'✓ Przerobione':'Oznacz jako przerobione'; };

  // ── router ──
  function render(){
    let p = location.pathname.replace(/\/+$/,'');
    if(!p.startsWith(BASE)) p = BASE;
    const seg = p.slice(BASE.length).split('/').filter(Boolean);
    if(seg.length===0) return viewHome();
    if(seg[0]==='e8'){
      if(seg[1]==='angielski') return renderTopicList(D.e8,[{label:'Egzaminy',path:BASE},{label:'Egzamin Ósmoklasisty',path:BASE+'/e8'},{label:'Język angielski'}]);
      return viewE8();
    }
    if(seg[0]==='matura'){
      if(seg[1]==='angielski'){
        if(seg[2]==='podstawa') return renderTopicList(D.matura.podstawa,[{label:'Egzaminy',path:BASE},{label:'Matura',path:BASE+'/matura'},{label:'Angielski',path:BASE+'/matura/angielski'},{label:'Podstawowy'}]);
        if(seg[2]==='rozszerzenie') return renderTopicList(D.matura.rozszerzenie,[{label:'Egzaminy',path:BASE},{label:'Matura',path:BASE+'/matura'},{label:'Angielski',path:BASE+'/matura/angielski'},{label:'Rozszerzony'}]);
        return viewMaturaLevels();
      }
      return viewMatura();
    }
    if(seg[0]==='zagadnienie' && seg[1]) return viewTopic(decodeURIComponent(seg[1]));
    return viewHome();
  }
  render();
})();
</script>
</body>
</html>
